<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Style</title>

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
   <header>
        <h1>URBAN STYLE</h1>
    
        <h3>Bienvenido/a! </h3>
        <p id="usuario"></p>     
        <p id="tipoCliente"></p>
        <p id="rol"></p>
        <p id="idioma"></p>
        <p id="conexion"></p>
        <p id="idCliente"></p>
        <p id="fecha"></p>
    </header>

    <main>
        <section id="oferta">
            <p>⚡️ OFERTA RELÁMPAGO ⚡️</p>

            <button id ="btnOferta">¡ACTIVAR OFERTA!</button>
            <p id="contadorOferta"></p>
        </section>

        <section id="catalogo">
            <h2>Catálogo</h2>

            <div>
                <h3>Chaqueta Denim</h3>
                <p>59,90 €</p>
            </div>

            <div>
                <h3>Camiseta Urban</h3>
                <p>19,99 €</p>
            </div>
        </section>

        <section id="carrito">
            <h2>Carrito</h2>

            <p id="pedido"></p>
            <p id="subtotal"></p>
            <p id="descuento"></p>
            <p id="iva"></p>
            <p id="total"></p>
        </section>

        <section id="opiniones">
            <h2>Opiniones</h2>

            <form id="formOpinion">
                <label for="comentario">Escribe tu opinión:</label>
                <textarea id="comentario" required></textarea>
                <button type="submit">Publicar opinión</button>
            </form>

            <div id="listaOpiniones"></div>
        </section>
    </main>
</body>
</html>
